name: NextTrain
options:
  bundleIdPrefix: com.simonclur
packages:
  NextTrainCore:
    path: NextTrainCore
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # set your Personal Team ID here (Xcode > Settings > Accounts) to run on a real watch
    DEVELOPMENT_TEAM: ""
targets:
  NextTrainWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [NextTrainWatch, Shared]
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - target: NextTrainWidget
    info:
      path: NextTrainWatch/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: Finds the nearest station.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.watch
        GENERATE_INFOPLIST_FILE: NO
  NextTrainWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: NextTrainWidget
      - path: Shared
        excludes: [NextTrainShortcuts.swift]
      - path: NextTrainWatch/watch.db
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NextTrainWidget/Info.plist
      properties:
        CFBundleDisplayName: NextTrain
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Finds the nearest station.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.watch.widget
        GENERATE_INFOPLIST_FILE: NO
  NextTrainiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NextTrainiOS
        excludes: [NextTrainControl.swift, TrainLiveActivity.swift]
      - path: Shared
      - path: NextTrainWatch/watch.db
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - target: NextTrainiOSWidget
    info:
      path: NextTrainiOS/Info.plist
      properties:
        CFBundleDisplayName: NextTrain
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Finds the nearest station.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.ios
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  NextTrainiOSWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NextTrainiOS/NextTrainControl.swift
      - path: NextTrainiOS/TrainLiveActivity.swift
      - path: NextTrainWidget
        excludes: ["Info*.plist", "WatchBundle.swift"]
      - path: Shared
        excludes: [NextTrainShortcuts.swift]
      - path: NextTrainWatch/watch.db
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NextTrainiOS/WidgetInfo.plist
      properties:
        CFBundleDisplayName: NextTrain
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Finds the nearest station.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.ios.widget
        GENERATE_INFOPLIST_FILE: NO
  NextTrainMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NextTrainMac
        excludes: [MacWidgetBundle.swift]
      - path: Shared
        excludes: [TrainActivity.swift]
      - path: NextTrainWatch/watch.db
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - target: NextTrainMacWidget
    info:
      path: NextTrainMac/Info.plist
      properties:
        CFBundleDisplayName: NextTrain
        LSUIElement: true
        NSLocationUsageDescription: Finds the nearest station.
        NSLocationWhenInUseUsageDescription: Finds the nearest station.
    entitlements:
      path: NextTrainMac/NextTrainMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.mac
        GENERATE_INFOPLIST_FILE: NO
  NextTrainMacWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NextTrainWidget
        excludes: ["Info*.plist", "WatchBundle.swift"]
      - path: NextTrainMac/MacWidgetBundle.swift
      - path: Shared
        excludes: [NextTrainShortcuts.swift, TrainActivity.swift]
      - path: NextTrainWatch/watch.db
    dependencies:
      - package: NextTrainCore
      - package: NextTrainCore
        product: NextTrainUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: NextTrainMac/WidgetInfo.plist
      properties:
        CFBundleDisplayName: NextTrain
        NSWidgetWantsLocation: true
        NSLocationUsageDescription: Finds the nearest station.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NextTrainMac/NextTrainMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simonclur.nexttrain.mac.widget
        GENERATE_INFOPLIST_FILE: NO
